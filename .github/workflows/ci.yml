name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt pytest ruff

      - name: Baixar recursos do NLTK
        run: python -m nltk.downloader -q punkt_tab stopwords rslp

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -v
